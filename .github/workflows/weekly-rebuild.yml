name: Weekly Netlify Rebuild

on:
  schedule:
    # Every Tuesday at 13:00 UTC (9 AM EDT / 8 AM EST)
    - cron: '0 13 * * 2'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify Build Hook
        run: |
          curl -s -X POST -d '{}' https://api.netlify.com/build_hooks/699ccab95da05d8d0bee1ba7
          echo "Netlify rebuild triggered successfully"
